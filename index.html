<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>تفاصيل صغيرة من يوم عادي 🐾</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: #4f4347;
      overflow-x: hidden;

      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.92), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(235,215,198,.48), transparent 32%),
        linear-gradient(135deg, #fffaf6, #f6efe9);

      position: relative;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(8px);
      opacity: .35;
      z-index: 0;
      animation: moveBlob 12s ease-in-out infinite alternate;
    }

    .blob1 {
      width: 250px;
      height: 250px;
      top: -80px;
      right: -70px;
      background: #f1d8d0;
    }

    .blob2 {
      width: 210px;
      height: 210px;
      bottom: -60px;
      left: -50px;
      background: #eadfcf;
      animation-delay: 2s;
    }

    @keyframes moveBlob {
      from {
        transform: translate(0, 0);
      }
      to {
        transform: translate(20px, 18px);
      }
    }

    .paw-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .paw {
      position: absolute;
      opacity: .06;
      font-size: 22px;
      animation: pawFloat 10s ease-in-out infinite alternate;
    }

    .paw:nth-child(1) { top: 10%; left: 12%; }
    .paw:nth-child(2) { top: 28%; right: 10%; animation-delay: 2s; }
    .paw:nth-child(3) { top: 50%; left: 8%; animation-delay: 4s; }
    .paw:nth-child(4) { top: 70%; right: 13%; animation-delay: 1s; }
    .paw:nth-child(5) { top: 87%; left: 18%; animation-delay: 3s; }

    @keyframes pawFloat {
      from {
        transform: translateY(0) rotate(-5deg);
      }
      to {
        transform: translateY(-9px) rotate(5deg);
      }
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      z-index: 2;
    }

    .card {
      width: min(92vw, 680px);
      padding: 40px 28px;

      background: rgba(255,255,255,.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      border: 1px solid rgba(255,255,255,.95);
      border-radius: 30px;

      box-shadow:
        0 25px 70px rgba(80,55,60,.10),
        inset 0 1px rgba(255,255,255,.9);

      text-align: center;
      animation: appear .9s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .cat {
      font-size: 52px;
      margin-bottom: 10px;
      display: inline-block;
      animation: catMove 2.8s ease-in-out infinite alternate;
    }

    @keyframes catMove {
      from {
        transform: translateY(0) rotate(-3deg);
      }

      to {
        transform: translateY(-5px) rotate(3deg);
      }
    }

    h1 {
      font-size: clamp(28px, 6vw, 42px);
      color: #675258;
      margin-bottom: 12px;
    }

    .intro {
      font-size: 17px;
      line-height: 2;
      color: #7a696d;
      max-width: 520px;
      margin: 0 auto;
    }

    .divider {
      width: 52px;
      height: 3px;
      border-radius: 10px;
      background: #d9aaa3;
      margin: 24px auto;
    }

    .day-items {
      display: grid;
      gap: 14px;
      margin-top: 10px;
    }

    .day-button {
      width: 100%;
      padding: 15px 18px;
      border: 1px solid rgba(215,177,168,.42);
      border-radius: 20px;

      background: rgba(255,255,255,.75);
      color: #705b61;

      font-family: inherit;
      font-size: 16px;

      cursor: pointer;
      transition: .25s ease;
    }

    .day-button:hover {
      background: #fffaf7;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(130,90,90,.07);
    }

    .day-button:active {
      transform: scale(.98);
    }

    #messageBox {
      max-height: 0;
      opacity: 0;
      overflow: hidden;

      margin-top: 0;
      padding: 0 20px;

      border-radius: 20px;

      background: rgba(250,244,240,.8);

      color: #645359;
      font-size: 15px;
      line-height: 2;

      transition:
        max-height .6s ease,
        opacity .6s ease,
        margin .6s ease,
        padding .6s ease;
    }

    #messageBox.show {
      max-height: 280px;
      opacity: 1;
      margin-top: 18px;
      padding: 18px 20px;
    }

    .summary {
      margin-top: 28px;
      padding: 18px 20px;

      border-radius: 20px;

      background: rgba(255,248,245,.72);
      border: 1px solid rgba(215,177,168,.30);

      color: #8b7076;
      font-size: 15px;
      line-height: 1.9;

      opacity: 0;
      transform: translateY(8px);

      transition: .8s ease;
    }

    .summary.show {
      opacity: 1;
      transform: translateY(0);
    }

    .summary strong {
      color: #b77b75;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #ad999d;
    }

    .float-item {
      position: fixed;
      bottom: -35px;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      animation: rise linear forwards;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) rotate(20deg);
        opacity: 0;
      }
    }

    @media (max-width: 520px) {
      .card {
        padding: 34px 20px;
        border-radius: 25px;
      }

      .intro {
        font-size: 16px;
      }

      .day-button {
        font-size: 15px;
      }

      .cat {
        font-size: 47px;
      }
    }
  </style>
</head>

<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div class="paw-bg">
    <span class="paw">🐾</span>
    <span class="paw">🐾</span>
    <span class="paw">🐾</span>
    <span class="paw">🐾</span>
    <span class="paw">🐾</span>
  </div>

  <div class="page">

    <main class="card">

      <div class="cat" id="cat">😺</div>

      <h1>تفاصيل صغيرة من يوم عادي 🐾</h1>

      <p class="intro">
        اليوم ما صار شي كبير...
        <br>
        بس القطة قررت تجمع كم تفصيل صغير ما بدها ياه يضيع.
      </p>

      <div class="divider"></div>

      <div class="day-items">

        <button
          class="day-button"
          onclick="showMessage('chocolate')"
        >
          🍫 قطعة Twix
        </button>

        <button
          class="day-button"
          onclick="showMessage('walk')"
        >
          🚶 التمشاية
        </button>

        <button
          class="day-button"
          onclick="showMessage('night')"
        >
          🌙 آخر اليوم
        </button>

      </div>

      <div id="messageBox"></div>

      <div class="summary" id="summary">
        <strong>تقرير القطة لليوم:</strong>
        <br>
        ما صار شي كبير...
        بس كان في شوية تفاصيل حلوة
        بتكفي تخلي اليوم مو عادي تماماً 🐾
      </div>

      <div class="footer">
        القطة بتقول إن التفاصيل الصغيرة أحياناً بتضل أكتر من الأحداث الكبيرة 😼
      </div>

    </main>

  </div>

  <script>

    let openedItems = new Set();

    function showMessage(type) {

      const box = document.getElementById("messageBox");
      const summary = document.getElementById("summary");
      const cat = document.getElementById("cat");

      let text = "";

      if (type === "chocolate") {

        text =
          "مو لازم الهدية تكون كبيرة… أحياناً قطعة Twix نتشاركها سوا بتكفي تقول: كنت مفكر فيكي. 🍫🤍";

      }

      if (type === "walk") {

        text =
          "يمكن كانت تمشاية عادية… بس أوقات أبسط وقت منقضيه سوا بيطلع أحلى جزء بالنهار. 🚶🐾";

      }

      if (type === "night") {

        text =
          "واليوم ما قدرنا نحكي بالليل… بس مو كل يوم لازم يخلص بحكي طويل. أحياناً بكفي إنو مرقنا نهارنا وعرفنا إنو كل واحد بخير. 🌙🤍";

      }

      box.classList.remove("show");

      setTimeout(() => {

        box.textContent = text;
        box.classList.add("show");

      }, 150);


      openedItems.add(type);

      cat.textContent = "😸";


      if (openedItems.size === 3) {

        setTimeout(() => {

          summary.classList.add("show");

        }, 450);


        for (let i = 0; i < 9; i++) {

          setTimeout(() => {

            createFloat();

          }, i * 150);

        }

      }

    }


    function createFloat() {

      const item = document.createElement("div");

      item.className = "float-item";


      const symbols = [
        "🐾",
        "♡",
        "🍫",
        "🐾",
        "♡"
      ];


      item.textContent =
        symbols[
          Math.floor(
            Math.random() * symbols.length
          )
        ];


      item.style.left =
        Math.random() * 100 + "vw";


      item.style.fontSize =
        (15 + Math.random() * 15) + "px";


      item.style.animationDuration =
        (5 + Math.random() * 4) + "s";


      item.style.color =
        "rgba(190, 135, 130, .28)";


      document.body.appendChild(item);


      setTimeout(() => {

        item.remove();

      }, 9000);

    }

  </script>

</body>
</html>
